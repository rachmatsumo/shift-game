<head>

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<title>SHIFT - Game Off 2026</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#090614;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #game-wrap{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.85)}
  canvas{width:100%;height:100%;background:#000;display:block;touch-action:none}
  #rotate-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#090614;color:#fff;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:24px}
  #rotate-overlay .icon{font-size:54px;margin-bottom:14px;color:#ffd166;animation:spinPhone 2.2s infinite ease-in-out}
  @keyframes spinPhone{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
  @media (orientation: portrait) and (max-width: 900px){#rotate-overlay{display:flex}}

  /* Profile Setup Modal */
  #profile-modal{display:none;position:fixed;inset:0;z-index:9000;background:rgba(6,4,15,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center;font-family:"Trebuchet MS",sans-serif}
  #profile-box{background:linear-gradient(135deg,#1b1145,#2a1338);border:2px solid #ffd166;box-shadow:0 0 40px rgba(255,209,102,.3);border-radius:14px;padding:24px;width:90%;max-width:440px;color:#fff}
  #profile-box h2{margin:0 0 14px;text-align:center;color:#ffd166;font-size:20px;letter-spacing:1px}
  #profile-box label{font-size:12px;color:#c0c6ff;display:block;margin-top:10px}
  #profile-box input,#profile-box select{width:100%;box-sizing:border-box;background:#09061e;border:1px solid #6c5ce7;color:#fff;padding:8px 12px;border-radius:6px;font-size:14px;margin-top:4px}
  #profile-box input:focus,#profile-box select:focus{outline:none;border-color:#ffd166}
  .avatar-row{display:flex;gap:12px;margin-top:8px;justify-content:center}
  .av-btn{font-size:24px;background:#15102a;border:2px solid #584b7a;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .18s ease;display:flex;align-items:center;justify-content:center}
  .av-btn:hover{background:#251c4a;border-color:#00cec9;transform:translateY(-2px)}
  .av-btn.selected{border-color:#ffd166;transform:scale(1.15);background:#2d1b54;box-shadow:0 0 16px rgba(255,209,102,.5)}
  .av-btn i{filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  #btn-save-profile{width:100%;margin-top:18px;background:linear-gradient(90deg,#f39c12,#ffd166);border:none;color:#1b1145;font-weight:bold;padding:10px;border-radius:8px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="rotate-overlay">
  <div class="icon"><i class="bi bi-phone-landscape"></i></div>
  <h2 style="margin:0 0 8px">Mode Landscape Diperlukan</h2>
  <p style="margin:0;color:#c0c6ff">Silakan putar perangkat HP Anda ke posisi horizontal (landscape) untuk bermain.</p>
</div>

<!-- Player Profile Modal Dialog -->
<div id="profile-modal">
  <div id="profile-box">
    <h2 id="prof-title"><i class="bi bi-person-badge"></i> TRAVELER PROFILE</h2>
    <label id="lbl-name">Player Name:</label>
    <input type="text" id="prof-name" maxlength="14" placeholder="Enter traveler name">

    <label id="lbl-avatar">Choose Avatar:</label>
    <div class="avatar-row" id="avatar-container"></div>

    <label id="lbl-country">Country / Region:</label>
    <select id="prof-country">
      <option value="ID">ID - Indonesia</option>
      <option value="US">US - United States</option>
      <option value="GB">GB - United Kingdom</option>
      <option value="JP">JP - Japan</option>
      <option value="SG">SG - Singapore</option>
      <option value="MY">MY - Malaysia</option>
      <option value="DE">DE - Germany</option>
      <option value="FR">FR - France</option>
      <option value="BR">BR - Brazil</option>
      <option value="AU">AU - Australia</option>
      <option value="OTHER">GL - Global / Other</option>
    </select>

    <button id="btn-save-profile"><i class="bi bi-check-circle"></i> Save & Start Journey</button>
  </div>
</div>

<div id="game-wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
<script src="src/i18n.js"></script>
<script src="src/profile.js"></script>
<script src="src/leaderboard.js"></script>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
