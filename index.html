<title>SHIFT - Game Off 2026</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#090614;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Outfit',sans-serif}
  #game-wrap{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.85)}
  canvas{width:100%;height:100%;background:#000;display:block;touch-action:none}

  /* On mobile touch devices in landscape mode: stretch canvas 100% full screen to eliminate black pillarbox borders */
  @media (max-height: 500px), (pointer: coarse) and (orientation: landscape) {
    #game-wrap {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      aspect-ratio: unset !important;
      box-shadow: none !important;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  }
  #rotate-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#090614;color:#fff;flex-direction:column;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;text-align:center;padding:24px}
  #rotate-overlay .icon{font-size:54px;margin-bottom:14px;color:#ffd166;animation:spinPhone 2.2s infinite ease-in-out}
  @keyframes spinPhone{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
  @media (orientation: portrait) and (max-width: 900px){#rotate-overlay{display:flex}}

  /* Profile Setup Modal - Compact & Sleek for Landscape Mobile */
  #profile-modal{display:none;position:fixed;inset:0;z-index:9000;background:rgba(6,4,15,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center;font-family:'Outfit',sans-serif;padding:8px;box-sizing:border-box}
  #profile-box{background:linear-gradient(135deg,#1b1145,#2a1338);border:2px solid #ffd166;box-shadow:0 0 35px rgba(255,209,102,.3);border-radius:12px;padding:10px 18px;width:100%;max-width:370px;color:#fff;max-height:92vh;overflow-y:auto;box-sizing:border-box}
  #profile-box h2{margin:0 0 6px;text-align:center;color:#ffd166;font-size:15px;letter-spacing:1.2px;font-family:'Cinzel',serif;font-weight:700}
  #profile-box label{font-size:10.5px;color:#c0c6ff;display:block;margin-top:4px;font-family:'Outfit',sans-serif}
  #profile-box input,#profile-box select{width:100%;box-sizing:border-box;background:#09061e;border:1px solid #6c5ce7;color:#fff;padding:5px 9px;border-radius:6px;font-size:12.5px;margin-top:2px;font-family:'Outfit',sans-serif}
  #profile-box input:focus,#profile-box select:focus{outline:none;border-color:#ffd166}
  .avatar-row{display:flex;gap:7px;margin-top:3px;justify-content:center}
  .av-btn{font-size:16px;background:#15102a;border:2px solid #584b7a;color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;transition:all .18s ease;display:flex;align-items:center;justify-content:center}
  .av-btn:hover{background:#251c4a;border-color:#00cec9;transform:translateY(-1px)}
  .av-btn.selected{border-color:#ffd166;transform:scale(1.1);background:#2d1b54;box-shadow:0 0 12px rgba(255,209,102,.5)}
  .av-btn i{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  #btn-save-profile{width:100%;background:linear-gradient(90deg,#f39c12,#ffd166);border:none;color:#1b1145;font-weight:bold;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;font-family:'Outfit',sans-serif}
</style>
</head>
<body>
<!-- Hidden typography activator ensuring Web Fonts render on canvas immediately -->
<div style="position:fixed;top:-999px;opacity:0;pointer-events:none;font-family:'Cinzel Decorative';font-weight:900" aria-hidden="true">SHIFT</div>
<div style="position:fixed;top:-999px;opacity:0;pointer-events:none;font-family:'Cinzel';font-weight:700" aria-hidden="true">SHIFT</div>
<div style="position:fixed;top:-999px;opacity:0;pointer-events:none;font-family:'Outfit';font-weight:600" aria-hidden="true">SHIFT</div>

<div id="rotate-overlay">
  <div class="icon"><i class="bi bi-phone-landscape"></i></div>
  <h2 style="margin:0 0 8px">Mode Landscape Diperlukan</h2>
  <p style="margin:0;color:#c0c6ff">Silakan putar perangkat HP Anda ke posisi horizontal (landscape) untuk bermain.</p>
</div>

<!-- Player Profile Modal Dialog -->
<div id="profile-modal">
  <div id="profile-box" style="position:relative">
    <button id="btn-top-back-profile" aria-label="Back" style="position:absolute;top:8px;left:10px;background:rgba(255,255,255,0.12);border:1px solid #ffd166;color:#ffd166;padding:4px 9px;border-radius:6px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px"><i class="bi bi-arrow-left"></i> Back</button>
    <button id="btn-close-profile" aria-label="Close" style="position:absolute;top:8px;right:10px;background:rgba(255,255,255,0.12);border:1px solid #ff7675;color:#ff7675;width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center"><i class="bi bi-x-lg"></i></button>
    <h2 id="prof-title" style="margin:2px 0 10px"><i class="bi bi-person-badge"></i> GAMER PROFILE</h2>
    <label id="lbl-name">Gamer Name:</label>
    <input type="text" id="prof-name" maxlength="14" placeholder="Enter gamer name" value="Gamer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <label id="lbl-avatar">Choose Avatar:</label>
    <div class="avatar-row" id="avatar-container"></div>

    <label id="lbl-country">Country / Region:</label>
    <select id="prof-country">
      <option value="ID">ID - Indonesia</option>
      <option value="US">US - United States</option>
      <option value="GB">GB - United Kingdom</option>
      <option value="JP">JP - Japan</option>
      <option value="SG">SG - Singapore</option>
      <option value="MY">MY - Malaysia</option>
      <option value="DE">DE - Germany</option>
      <option value="FR">FR - France</option>
      <option value="BR">BR - Brazil</option>
      <option value="AU">AU - Australia</option>
      <option value="OTHER">GL - Global / Other</option>
    </select>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="btn-cancel-profile" style="flex:1;background:rgba(255,255,255,0.12);border:1px solid #6c5ce7;color:#fff;font-weight:bold;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px"><i class="bi bi-arrow-left"></i> Back</button>
      <button id="btn-save-profile" style="flex:2;margin-top:0;background:linear-gradient(90deg,#f39c12,#ffd166);border:none;color:#1b1145;font-weight:bold;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px"><i class="bi bi-check-circle"></i> Save & Play</button>
    </div>
  </div>
</div>

<div id="game-wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=7').then(reg => {
    reg.update();
  }).catch(()=>{});
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
}
</script>
<script src="src/i18n.js?v=7"></script>
<script src="src/profile.js?v=7"></script>
<script src="src/leaderboard.js?v=7"></script>
<script src="src/levels.js?v=7"></script>
<script src="src/audio.js?v=7"></script>
<script src="src/game.js?v=7"></script>
</body>
</html>
